# Prometheus Adapter configuration for custom metrics
# Преобразует метрики Prometheus в Kubernetes custom metrics API

prometheus:
  url: http://prometheus-kube-prometheus-prometheus.advanced-hpa-example-monitoring.svc.cluster.local
  port: 9090

rules:
  custom:
  # Правило для RPS метрики из Istio Ingress Gateway
  - seriesQuery: 'istio_requests_total{source_workload="private-ingressgateway",destination_service="scaletestapp-service.advanced-hpa-example.svc.cluster.local"}'
    resources:
      # Связываем метрику с namespace
      overrides:
        destination_service_namespace:
          resource: namespace
    name:
      # Имя кастомной метрики для HPA
      as: "scaletestapp_requests_per_second"
    metricsQuery: |
      sum(rate(istio_requests_total{
        source_workload="private-ingressgateway",
        destination_service="scaletestapp-service.advanced-hpa-example.svc.cluster.local",
        <<.LabelMatchers>>
      }[1m])) by (<<.GroupBy>>)

# Включаем RBAC
rbac:
  create: true

# ServiceAccount
serviceAccount:
  create: true
  name: prometheus-adapter

# Resources
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Логирование
logLevel: 4
